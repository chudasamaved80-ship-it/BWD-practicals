<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Donation Form</title>
</head>
<body bgcolor="pink">
    <center>
    <h1>Blood Donation Registration</h1></center>
    <form>
        <fieldset>
            </style>

            <legend>Personal Information</legend>

            <label for="fullName">Full Name:</label><br>
            <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required><br><br>

            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" placeholder="Enter your email"><br><br>

            <label for="phone">Phone Number:</label><br>
            <input type="tel" id="phone" name="phone" placeholder="Enter your phone number"><br><br>

            <label for="age">Age:</label><br>
            <input type="number" id="age" name="age" min="18" max="65" placeholder="18" required><br><br>

            <label for="gender">Gender:</label><br>
            <select id="gender" name="gender">
                <option value="">Select gender</option>
                <option value="female">Female</option>
                <option value="male">Male</option>
                <option value="other">Other</option>
            </select><br><br>
        </fieldset>

        <fieldset>
            <legend>Donation Details</legend>

            <label for="bloodGroup">Blood Group:</label><br>
            <select id="bloodGroup" name="bloodGroup" required>
                <option value="">Select blood group</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
            </select><br><br>

            <label>Donation Type:</label><br>
            <input type="radio" id="wholeBlood" name="donationType" value="Whole Blood" checked>
            <label for="wholeBlood">Whole Blood</label><br>
            <input type="radio" id="platelets" name="donationType" value="Platelets">
            <label for="platelets">Platelets</label><br>
            <input type="radio" id="plasma" name="donationType" value="Plasma">
            <label for="plasma">Plasma</label><br><br>

            <label for="lastDonation">Last Donation Date:</label><br>
            <input type="date" id="lastDonation" name="lastDonation"><br><br>

            <label for="location">Preferred Donation Center:</label><br>
            <input type="text" id="location" name="location" placeholder="Enter donation center or city"><br><br>
        </fieldset>

        <fieldset>
            <legend>Health Information</legend>

            <label for="weight">Weight (kg):</label><br>
            <input type="number" id="weight" name="weight" min="45" placeholder="Enter your weight"><br><br>

            <label for="healthNotes">Health Notes:</label><br>
            <textarea id="healthNotes" name="healthNotes" rows="4" cols="40" placeholder="Any recent illnesses, medications, or notes"></textarea><br><br>

            <input type="checkbox" id="agree" name="agree" required>
            <label for="agree">I confirm that I am eligible to donate blood and the information above is accurate.</label><br><br>
        </fieldset>

        <button type="submit">Submit Registration</button>
    </form>
</body>
</html>
